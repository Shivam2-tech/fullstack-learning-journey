<!DOCTYPE html>
<html>

<head>
    <link rel="Stylesheet" href="style.css">
</head>

<body>
    <h1>Number Guessing Game</h1>
    <input type="number" id="value" placeholder="Take A Guess....">
    <button id="guessBtn" onclick="guess()">CONFIRM</button>
    <button id="playAgain" onclick="resetGame()" style="display:none; margin-left:10px">Play Again</button>
    <div id="RESULT">Result:</div>
    <div id="attempt">Attempts:</div>
    <h2 id="win"></h2>
    <script src="script.js"></script>
</body>

</html>
